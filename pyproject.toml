[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "road-risk-intelligence"
version = "0.1.0"
description = "Machine learning decision-support system for road accident risk prioritization."
requires-python = ">=3.11,<3.14"

[tool.setuptools.packages.find]
where = ["src"]